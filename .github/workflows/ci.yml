name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer le CLI Code Connect
        run: npm ci

      - name: Vérifier les types des templates
        run: npm run typecheck

      - name: Parser les quatre stacks
        run: bash scripts/connect.sh parse --all

      - name: Tests de rendu des templates
        run: npm test
